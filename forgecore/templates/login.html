{% extends "base.html" %}
{% block title %}Sign in &middot; {{ app_name }}{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">This console is protected by a single operator password.</p>
  <form method="post" action="/login">
    <label for="password">Console password</label>
    <input id="password" name="password" type="password" required
           autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted small">Forgotten the vault password?
    <a href="/recover">Use the recovery code</a>.
  </p>
</section>
{% endblock %}
