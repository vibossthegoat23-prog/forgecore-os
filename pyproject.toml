[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecore-os"
version = "1.0.0"
description = "ForgeCore OS - a local operator console with an encrypted vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50,<51",
    "fastapi>=0.110,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
forgecore = "forgecore.cli:main"

[tool.setuptools]
packages = ["forgecore"]

[tool.setuptools.package-data]
forgecore = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
