[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecore-os"
version = "1.0.0"
description = "ForgeCore OS - a local operator console with an encrypted vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forgecore = "forgecore.cli:main"

[tool.setuptools]
packages = ["forgecore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
